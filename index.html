<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Renshū N4</title>
<meta name="description" content="Práctica de japonés para el Noken 4: gramática, vocabulario y kanji.">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F131A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Renshū N4">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: una columna estrecha tipo cuaderno, pensada para el pulgar; tinta 藍 (índigo) sobre papel frío, 朱 para la ★ */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --sunken:#E7EBF1; --ink:#172031; --muted:#5B6578; --line:#D5DBE5;
  --ai:#2B4A8B; --ai-soft:#E1E8F6; --ai-ink:#FFFFFF; --shu:#C4432B;
  --ok:#1E7A4C; --ok-soft:#DCF0E4; --ng:#B4372C; --ng-soft:#F7E0DC;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --f-k:"Klee One","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F131A; --surface:#18202B; --sunken:#212A37; --ink:#E6EAF1; --muted:#9AA4B6; --line:#2C3646;
  --ai:#8FA9EA; --ai-soft:#22304C; --ai-ink:#0F131A; --shu:#F08A70;
  --ok:#5DC48E; --ok-soft:#15342A; --ng:#F0857A; --ng-soft:#3C1F1D; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F131A; --surface:#18202B; --sunken:#212A37; --ink:#E6EAF1; --muted:#9AA4B6; --line:#2C3646;
  --ai:#8FA9EA; --ai-soft:#22304C; --ai-ink:#0F131A; --shu:#F08A70;
  --ok:#5DC48E; --ok-soft:#15342A; --ng:#F0857A; --ng-soft:#3C1F1D; color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nofuri rt{visibility:hidden}
rt{font-size:.55em;color:var(--muted);font-weight:500}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;min-height:56px}
.bar-t{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{flex:1;font-weight:700;font-size:18px;letter-spacing:.02em}
.brand-k{font-family:var(--f-k);color:var(--ai);font-size:22px;margin-right:2px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;flex:none}
.iconbtn.furi{font-family:var(--f-k);font-size:17px}
.iconbtn.furi.on{background:var(--ai);color:var(--ai-ink);border-color:var(--ai)}
.prog{flex:1;height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.prog-f{height:100%;background:var(--ai);border-radius:99px;transition:width .3s}
.count{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);min-width:3.2em;text-align:right}

/* Inicio */
main{padding-block:20px 40px}
.hero h1{font-family:var(--f-k);font-weight:600;font-size:30px;line-height:1.25;margin:4px 0 6px;text-wrap:balance}
.hero h1 span{color:var(--ai)}
.hero p{margin:0 0 16px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.stats span{font-size:12px;color:var(--muted)}
.tiles{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.tile .gl{font-family:var(--f-k);font-size:40px;line-height:1;width:58px;height:58px;display:grid;place-items:center;border-radius:12px;background:var(--ai-soft);color:var(--ai);flex:none}
.tile.all .gl{background:var(--ai);color:var(--ai-ink)}
.tile .tt{flex:1;min-width:0}
.tile .tt b{display:block;font-size:18px}
.tile .tt span{font-size:13px;color:var(--muted)}
.tile .arr{color:var(--muted);font-size:20px}
.review{margin-top:14px;width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:var(--r);border:1.5px dashed var(--shu);background:transparent;color:var(--shu);font-weight:700}
.review span{background:var(--shu);color:var(--surface);border-radius:99px;padding:0 10px;font-variant-numeric:tabular-nums}
.foot{font-size:13px;color:var(--muted);margin-top:22px}

/* Sección */
.sech{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.sech .gl{font-family:var(--f-k);font-size:46px;color:var(--ai);line-height:1}
.sech h2{margin:0;font-size:22px}
.sech p{margin:0;color:var(--muted);font-size:14px}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.modes{display:grid;gap:8px;margin-top:6px}
.tgs{display:grid;gap:6px}
.tg{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tg.has{border-color:var(--ai)}
.tgh{display:flex;align-items:stretch}
.tgsel{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:0;padding:10px 12px;font-size:15px}
.tck{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ai-ink)}
.tg.has .tck{background:var(--ai-soft);border-color:var(--ai);color:var(--ai)}
.tgsel.on .tck{background:var(--ai);color:var(--ai-ink)}
.tgn{flex:1;min-width:0;font-weight:500}
.tgc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tgx{flex:none;width:48px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--muted);font-size:16px}
.tgl{padding:0 12px 12px}
.mode{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.mode .mj{font-size:12px;color:var(--ai);font-weight:700;display:block}
.mode b{display:block;font-size:16px}
.mode span.d{font-size:13px;color:var(--muted)}
.mode .go{margin-left:auto;color:var(--muted)}
.mode.star{border-color:var(--ai);background:var(--ai-soft)}

/* Pregunta */
.qmain{padding-block:16px 48px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--ai);background:var(--ai-soft);border-radius:8px;padding:2px 8px;margin-bottom:10px}
.prompt{font-size:20px;line-height:1.7;word-break:break-word}
.prompt .bigk{font-family:var(--f-k);font-size:104px;line-height:1.1;text-align:center;padding:8px 0}
.prompt .pword{font-family:var(--f-k);font-size:40px;text-align:center;line-height:1.8;padding:6px 0}
.prompt .pmean{font-size:24px;font-weight:700;text-align:center;padding:14px 0 4px}
.prompt .pmeta{font-size:14px;color:var(--muted);text-align:center}
.psent{font-size:20px;line-height:2}
.blank{display:inline-block;min-width:3.4em;border-bottom:2px solid var(--ai);margin:0 3px;height:1.3em;vertical-align:-2px}
.hint{font-size:14px;color:var(--muted);font-style:italic;margin-top:2px}
.sub{color:var(--muted);font-size:14px;margin:6px 0 14px}
.slot{display:inline-block;width:3.2em;border-bottom:2px solid var(--muted);margin:0 3px;height:1.4em;vertical-align:-4px;text-align:center;line-height:1.4}
.slot.star{border-color:var(--shu);color:var(--shu);font-weight:700}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;text-align:left;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:17px;line-height:1.5}
.opt:disabled{cursor:default;opacity:1}
.opt .num{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.opt .ot{min-width:0;word-break:break-word}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .num{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.ng{border-color:var(--ng);background:var(--ng-soft)}
.opt.ng .num{background:var(--ng);border-color:var(--ng);color:var(--surface)}
.kopts{grid-template-columns:1fr 1fr}
.kopts .opt{justify-content:center;font-family:var(--f-k);font-size:44px;min-height:84px;position:relative}
.kopts .opt .num{position:absolute;top:8px;left:8px}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.passage summary{font-weight:700;cursor:pointer;color:var(--ai)}
.ptext{font-size:17px;line-height:2.1;white-space:pre-line;margin-top:6px}
.inform{display:grid;gap:10px}
.tin{width:100%;font:inherit;font-size:22px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.preview{min-height:1.4em;color:var(--ai);font-size:18px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.btn{border-radius:12px;padding:13px 16px;font-weight:700;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
.btn.primary{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}

/* Feedback */
.fb{margin-top:16px;border-radius:var(--r);padding:14px 16px;border:1.5px solid var(--line);background:var(--surface);display:grid;gap:10px}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.ng{border-color:var(--ng);background:var(--ng-soft)}
.fb-h{font-weight:700;font-size:17px}
.fb.ok .fb-h{color:var(--ok)}
.fb.ng .fb-h{color:var(--ng)}
.fb-x{font-size:15px;line-height:1.7;word-break:break-word}
.fb-x .jp{font-size:17px}
.jk{font-family:var(--f-k);font-size:1.3em}

/* Ordenar */
.line{font-size:19px;line-height:2.6;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:64px}
.pc{display:inline-block;border:1.5px solid var(--ai);background:var(--ai-soft);color:var(--ink);border-radius:10px;padding:2px 10px;margin:2px;font-size:18px;line-height:1.6}
.pc.empty{border-style:dashed;border-color:var(--line);background:transparent;min-width:3em;color:transparent}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.pool .pc{background:var(--surface);padding:8px 14px}

/* Unir */
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcol{display:grid;gap:8px;align-content:start}
.mb{min-height:58px;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:15px;line-height:1.35;word-break:break-word}
.mb.k{font-family:var(--f-k);font-size:30px}
.mb.sel{border-color:var(--ai);background:var(--ai-soft)}
.mb.done{border-color:var(--ok);background:var(--ok-soft);opacity:.55}
.mb.bad{border-color:var(--ng);background:var(--ng-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.mb.bad{animation:none}.prog-f{transition:none}}

/* Dibujar */
.drawinfo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.drawinfo b{font-size:20px}
.pad{position:relative;width:100%;max-width:320px;aspect-ratio:1;margin:0 auto;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);overflow:hidden}
.pad::before,.pad::after{content:"";position:absolute;pointer-events:none;border:0 dashed var(--line)}
.pad::before{left:50%;top:0;bottom:0;border-left-width:1.5px}
.pad::after{top:50%;left:0;right:0;border-top-width:1.5px}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.reveal{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0}
.reveal .bigk{font-family:var(--f-k);font-size:96px;line-height:1}

/* Resultado */
.score{text-align:center;padding:18px 0 8px}
.score b{font-size:56px;font-variant-numeric:tabular-nums;line-height:1}
.score span{display:block;color:var(--muted)}
.score .kk{font-family:var(--f-k);font-size:28px;color:var(--ai);margin-bottom:6px}
.wlist{display:grid;gap:8px;margin-top:10px}
.witem{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ng);border-radius:10px;padding:10px 12px;font-size:14px;word-break:break-word}
.witem .wp{font-size:16px}
.witem .wp .bigk{font-family:var(--f-k);font-size:32px}
.witem .wp .pword{font-family:var(--f-k);font-size:22px}
.witem .wp .pmean{font-weight:700}
.witem .wp .pmeta{display:none}
.witem .wa{color:var(--ok);font-weight:700;margin-top:4px}
.actions{display:grid;gap:8px;margin-top:20px}
</style>

<div id="app"></div>

<script>
'use strict';
/* ================= DATOS ================= */

const KANJI_RAW=`悪|アク、オ|わる・い|Mal

const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
function mark(id,ok){
  if(!id)return;
  const it=S.items[id]||(S.items[id]={r:0,w:0});
  if(ok){it.r++;}else{it.w++;}
  S.answered++;if(ok)S.correct++;
  const d=today();if(!S.days.includes(d)){S.days.push(d);if(S.days.length>400)S.days.shift();}
  save();
}
function streak(){
  let n=0;const d=new Date();
  for(;;){const k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
    if(S.days.includes(k)){n++;d.setDate(d.getDate()-1);}else{if(n===0&&k===today()){d.setDate(d.getDate()-1);const k2=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();if(!S.days.includes(k2))break;continue;}break;}}
  return n;
}

function weight(id){const it=S.items[id];if(!it)return 1.3;return Math.max(.25,1+it.w*2-it.r*.6);}
function pickW(arr,n,idf){
  const pool=arr.map(x=>({x,w:weight(idf?idf(x):x)}));const out=[];
  while(out.length<n&&pool.length){let tot=0;pool.forEach(p=>tot+=p.w);let r=Math.random()*tot,i=0;
    for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break;}
    out.push(pool.splice(Math.min(i,pool.length-1),1)[0].x);}
  return out;
}

function romaji(s){
  s=s.toLowerCase();let o='',i=0;
  while(i<s.length){const c=s[i],nx=s[i+1];
    if(c==='-'){o+='ー';i++;continue;}
    if(!/[a-z']/.test(c)){o+=c;i++;continue;}
    if(c==='n'){
      if(nx==="'"){o+='ん';i+=2;continue;}
      if(nx==='n'){o+='ん';i+=(s[i+2]&&/[aiueoy]/.test(s[i+2]))?1:2;continue;}
      if(!nx||!/[aiueoy]/.test(nx)){o+='ん';i++;continue;}
    }
    if(/[bcdfghjkmpqrstvwxyz]/.test(c)&&nx===c){o+='っ';i++;continue;}
    let m=false;for(const L of [4,3,2,1]){const k=s.substr(i,L);if(RO[k]){o+=RO[k];i+=L;m=true;break;}}
    if(!m){o+=c;i++;}
  }
  return o;
}

const ROW={u:'うくぐすつぬぶむる',i:'いきぎしちにびみり',a:'わかがさたなばまら',e:'えけげせてねべめれ',o:'おこごそとのぼもろ'};

const SURU={masu:'します',nai:'しない',te:'して',ta:'した',pot:'できる',pass:'される',caus:'させる',vol:'しよう',ba:'すれば',imp:'しろ',nasai:'しなさい',tai:'したい'};

const KURU_R={masu:'きます',nai:'こない',te:'きて',ta:'きた',pot:'こられる',pass:'こられる',caus:'こさせる',vol:'こよう',ba:'くれば',imp:'こい',nasai:'きなさい',tai:'きたい'};
const ICHI={masu:'ます',nai:'ない',te:'て',ta:'た',pot:'られる',pass:'られる',caus:'させる',vol:'よう',ba:'れば',imp:'ろ',nasai:'なさい',tai:'たい'};
function conj(v,t,f){
  if(t==='v3'){
    if(v.endsWith('する'))return v.slice(0,-2)+SURU[f];
    if(v.endsWith('来る'))return v.slice(0,-1)+KURU_K[f];
    if(v.endsWith('くる'))return v.slice(0,-2)+KURU_R[f];
  }
  if(t==='v2')return v.slice(0,-1)+ICHI[f];
  const s=v.slice(0,-1),c=v.slice(-1);
  switch(f){
    case 'masu':return s+sh(c,'i')+'ます';
    case 'nai':return s+sh(c,'a')+'ない';
    case 'te':case 'ta':{const T=f==='te'?['て','で']:['た','だ'];
      if(v==='行く'||v==='いく')return s+'っ'+T[0];

    case 'v':return VBY[p[1]]?vocabQ(VBY[p[1]],p[2]):null;
    case 'x':return CTX[+p[1]]?ctxQ(+p[1]):null;
    case 'p':return PARA[+p[1]]?paraQ(+p[1]):null;
    case 'g':return GQ[+p[1]]?gformQ(+p[1]):null;
    case 'o':return ORD[+p[1]]?starQ(+p[1]):null;
    case 'b':return ORD[+p[1]]?buildQ(+p[1]):null;
    case 'c':return VBY[p[1]]?conjQ(VBY[p[1]],p[2]):null;
    case 'ct':return VBY[p[1]]?conjTQ(VBY[p[1]],p[2]):null;
    case 'gp':return PAT[+p[1]]?patQ(+p[1],p[2]):null;
    case 'kg':return KEIGO[+p[1]]?keigoQ(+p[1],p[2]):null;
    case 'r':return RD[+p[1]]?readQ(+p[1],+p[2]):null;
    case 't':return TR[+p[1]]?trQ(+p[1],p[2]):null;
    case 'a':return VBY[p[1]]&&AFORMS[p[2]]?adjQ(VBY[p[1]],p[2]):null;
    case 'n':return NUM[+p[1]]?numQ(+p[1]):null;
  }}catch(e){console.error(e);}
  return null;
}

/* Conjuntos de ids */
const KRset=()=>new Set(KR().map(k=>k.k));
const POOLS={
  gform:()=>GQ.map((_,i)=>i).filter(i=>inT(GQT[i])).map(i=>`g:${i}`),
  gstar:()=>ORD.map((_,i)=>i).filter(i=>inT(ORDT[i])).map(i=>`o:${i}`),
  gbuild:()=>ORD.map((_,i)=>i).filter(i=>inT(ORDT[i])).map(i=>`b:${i}`),
  gconj:()=>{const fs=conjForms();return CONJV.flatMap(v=>fs.map(f=>`c:${v.w}:${f}`));},
  gconjt:()=>{const fs=conjForms();return CONJV.flatMap(v=>fs.map(f=>`ct:${v.w}:${f}`));},
  gpat:()=>PAT.map((_,i)=>i).filter(i=>inT(PATT[i])).flatMap(i=>[`gp:${i}:pm`,`gp:${i}:mp`]),
  gkeigo:()=>inT('keigo')?KEIGO.flatMap((k,i)=>[k[1]!=='—'?`kg:${i}:s`:null,k[2]!=='—'?`kg:${i}:k`:null]).filter(Boolean):[],
  gtr:()=>TR.map((_,i)=>i).filter(i=>inT(TR[i].tp)).flatMap(i=>[`t:${i}:je`,`t:${i}:ej`,`t:${i}:b`]),
  gadj:()=>{const fs=adjForms();return ADJ.flatMap(v=>fs.map(f=>`a:${v.w}:${f}`));},
  gnum:()=>NUM.map((_,i)=>i).filter(i=>inT(NUM[i].s)).map(i=>`n:${i}`),
  vtrje:()=>TR.map((_,i)=>`t:${i}:je`),
  vtrej:()=>TR.map((_,i)=>`t:${i}:ej`),
  vtrb:()=>TR.map((_,i)=>`t:${i}:b`),
  vje:()=>V.map(v=>`v:${v.w}:je`),
  vej:()=>V.map(v=>`v:${v.w}:ej`),
  vread:()=>V.filter(v=>hasKanji(v.w)).map(v=>`v:${v.w}:r`),
  vwrite:()=>V.filter(v=>hasKanji(v.w)).map(v=>`v:${v.w}:w`),
  vtype:()=>V.map(v=>`v:${v.w}:t`),
  vctx:()=>CTX.map((_,i)=>`x:${i}`),
  vpara:()=>PARA.map((_,i)=>`p:${i}`),
  kmean:()=>KR().map(k=>`k:${k.k}:m`),
  kfrom:()=>KR().map(k=>`k:${k.k}:f`),
  kon:()=>KR().filter(k=>k.on.length).map(k=>`k:${k.k}:o`),
  kkun:()=>KR().filter(k=>k.kun.length).map(k=>`k:${k.k}:u`),
  ktype:()=>KR().flatMap(k=>[`k:${k.k}:to`].concat(k.kun.length?[`k:${k.k}:tu`]:[])),
  kword:()=>{const s=KRset();return V.filter(v=>hasKanji(v.w)&&[...v.w].some(c=>s.has(c))).map(v=>`v:${v.w}:r`);},
  kdraw:()=>KR().map(k=>`k:${k.k}:d`)
};
function fromPool(name,n){return pickW(POOLS[name](),n).map(regen).filter(Boolean);}
function mixPools(names,n){
  const used=new Set(),out=[];let guard=0;
  while(out.length<n&&guard++<n*6){const name=names[rnd(names.length)];const ids=POOLS[name]().filter(x=>!used.has(x));if(!ids.length)continue;
    const id=pickW(ids,1)[0];used.add(id);const q=regen(id);if(q)out.push(q);}
  return out;
}
function pickDistinct(list,n,key){const seen=new Set(),out=[];for(const x of shuffle(list)){const k=key(x);if(seen.has(k))continue;seen.add(k);out.push(x);if(out.length===n)break;}return out;}
function matchItem(kind){
  switch(kind){
    case 'kmean':{const ks=pickDistinct(pickW(KR(),12,k=>`k:${k.k}:m`),5,k=>k.m);return {type:'match',tag:'Une kanji y significado',lk:true,pairs:ks.map(k=>({l:k.k,r:esc(k.m),id:`k:${k.k}:m`}))};}
    case 'kon':{const ks=pickDistinct(pickW(KR(),12,k=>`k:${k.k}:o`),5,k=>k.on.join('、'));return {type:'match',tag:'Une kanji y onyomi',lk:true,pairs:ks.map(k=>({l:k.k,r:k.on.join('、'),id:`k:${k.k}:o`}))};}
    case 'vmean':{const vs=pickDistinct(pickW(V,12,v=>`v:${v.w}:je`),5,v=>v.m);return {type:'match',tag:'Une palabra y significado',pairs:vs.map(v=>({l:ruby(v.w,v.r),r:esc(v.m),id:`v:${v.w}:je`}))};}
    case 'vread':{const vs=pickDistinct(pickW(V.filter(v=>hasKanji(v.w)),12,v=>`v:${v.w}:r`),5,v=>v.r);return {type:'match',tag:'Une palabra y lectura',pairs:vs.map(v=>({l:v.w,r:v.r,id:`v:${v.w}:r`}))};}
    case 'gpat':{let src=PAT.map((p,i)=>({p,i})).filter(x=>inT(PATT[x.i]));if(src.length<2)src=PAT.map((p,i)=>({p,i}));const ps=pickDistinct(src,5,x=>x.p.m);return {type:'match',tag:'Une patrón y significado',pairs:ps.map(x=>({l:esc(x.p.p),r:esc(x.p.m),id:`gp:${x.i}:pm`}))};}
    case 'keigo':{const ks=pickDistinct(KEIGO.map((k,i)=>({k,i})).filter(x=>x.k[1]!=='—'),5,x=>x.k[1]);return {type:'match',tag:'Une el verbo con su 尊敬語',pairs:ks.map(x=>({l:x.k[0],r:x.k[1],id:`kg:${x.i}:s`}))};}
    case 'gte':{const vs=sample(CONJV,5);return {type:'match',tag:'Une el verbo con su forma て',pairs:vs.map(v=>({l:ruby(v.w,v.r),r:conj(v.w,v.c,'te'),id:`c:${v.w}:te`}))};}
  }
}
function readingItems(n){
  const ps=shuffle(RD.map((_,i)=>i)).sort((a,b)=>{const s=i=>RD[i].qs.reduce((t,_,q)=>t+weight(`r:${i}:${q}`),0);return s(b)-s(a)+(Math.random()-.5);});
  const out=[];for(const p of ps){if(out.length>=n)break;RD[p].qs.forEach((_,q)=>out.push(readQ(p,q)));}
  return out;
}
function noken(){
  const sec=(t,items)=>items.map(it=>Object.assign(it,{tag:t}));
  return [].concat(
    sec('問題1 · 漢字読み',fromPool('vread',5)),
    sec('問題2 · 表記',fromPool('vwrite',3)),
    sec('問題3 · 文脈規定',fromPool('vctx',4)),
    sec('問題4 · 言い換え',fromPool('vpara',2)),
    sec('問題5 · 文法形式',fromPool('gform',6)),
    sec('問題6 · 文の組み立て ★',fromPool('gstar',2)),
    sec('問題7 · 読解',readingItems(1).slice(0,3))
  );
}

  R.done++;
  if(ok)R.ok++;else R.wrongs.push({it,head});
  const fb=document.getElementById('fb');
  const last=!R.inf&&R.i===R.items.length-1;
  fb.className='fb '+(ok?'ok':'ng');
  fb.innerHTML=`<div class="fb-h">${ok?'✓ ¡Correcto!':'✗ '+(head||'Incorrecto')}</div>${it.explain?`<div class="fb-x">${it.explain}</div>`:''}<button class="btn primary" data-act="next" id="nextbtn">${last?'Ver resultado':'Siguiente →'}</button>`;
  const nb=document.getElementById('nextbtn');
  nb.scrollIntoView({block:'nearest',behavior:'smooth'});
  setTimeout(()=>{try{nb.focus({preventScroll:true});}catch(e){}},50);
}
function next(){
  RUN.i++;
  if(RUN.inf&&RUN.i>=RUN.items.length-1){RUN.items=RUN.items.concat(RUN.b(10).filter(Boolean));}
  if(RUN.i>=RUN.items.length){go('result');}else{quizView();window.scrollTo(0,0);}
}
function renderMC(it,qb){
  qb.innerHTML=`<div class="opts ${it.kopt?'kopts':''}">${it.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="num">${i+1}</span><span class="ot">${o}</span></button>`).join('')}</div>`;
  const bs=qb.querySelectorAll('.opt');
  bs.forEach(b=>b.addEventListener('click',()=>{
    if(RUN.locked)return;RUN.locked=true;
    const i=+b.dataset.i,ok=i===it.ans;
    bs.forEach(x=>x.disabled=true);
    bs[it.ans].classList.add('ok');if(!ok)b.classList.add('ng');
    finish(ok,ok?'':`La correcta es: <span class="jp">${it.options[it.ans]}</span>`);
  }));
}
function renderInput(it,qb){
  qb.innerHTML=`<form class="inform" id="inf" autocomplete="off"><input id="ans" class="tin" lang="ja" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="かな o romaji" aria-label="Tu respuesta"><div class="preview" id="pv"></div><div class="row"><button type="button" class="btn ghost" id="skip">No lo sé</button><button class="btn primary" id="chk">Comprobar</button></div></form>`;
  const inp=qb.querySelector('#ans'),pv=qb.querySelector('#pv');
  inp.addEventListener('input',()=>{const v=inp.value;pv.textContent=/[a-z]/i.test(v)?'→ '+romaji(v):'';});
  const done=give=>{
    if(RUN.locked)return;RUN.locked=true;
    const n=normAns(inp.value);const ok=!give&&!!n&&it.accept.some(a=>normAns(a)===n);
    inp.disabled=true;qb.querySelector('#chk').disabled=true;qb.querySelector('#skip').disabled=true;
    finish(ok,ok?'':`Respuesta: <span class="jp">${it.show}</span>`);
    if(ok)document.querySelector('#fb .fb-h').innerHTML=`✓ ¡Correcto! <span class="jp" style="font-weight:500">${it.show}</span>`;
  };
  qb.querySelector('#inf').addEventListener('submit',e=>{e.preventDefault();done(false);});
  qb.querySelector('#skip').addEventListener('click',()=>done(true));
  setTimeout(()=>inp.focus(),60);
}
function renderOrder(it,qb){
  const all=it.toks.concat(it.extra||[]),need=it.toks.length,target=it.toks.join('');
  const perm=shuffle(all.map((_,i)=>i));let placed=[];
  const draw=()=>{
    const slots=placed.map((p,j)=>`<button class="pc" data-r="${j}">${esc(all[p])}</button>`).join('')+'<span class="pc empty">・</span>'.repeat(Math.max(0,need-placed.length));
    qb.innerHTML=`<div class="line">${esc(it.pre)}${slots}${esc(it.post)}</div><div class="pool">${perm.filter(i=>!placed.includes(i)).map(i=>`<button class="pc" data-p="${i}">${esc(all[i])}</button>`).join('')||'<span class="sub">Todas colocadas.</span>'}</div><div class="row"><button class="btn ghost" id="clr">Borrar</button><button class="btn primary" id="chk" ${placed.length!==need?'disabled':''}>Comprobar</button></div>`;
    if(RUN.locked){qb.querySelectorAll('button').forEach(b=>b.disabled=true);return;}
    qb.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{if(placed.length<need){placed.push(+b.dataset.p);draw();}});
    qb.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{placed.splice(+b.dataset.r,1);draw();});
    qb.querySelector('#clr').onclick=()=>{placed=[];draw();};
    qb.querySelector('#chk').onclick=()=>{
      RUN.locked=true;const ok=placed.map(p=>all[p]).join('')===target;draw();
      finish(ok,ok?'':'Lo correcto es:');
      if(!ok&&it.override){
        const fb=document.getElementById('fb'),b=document.createElement('button');
        b.className='btn';b.textContent='Mi orden también es válido';
        b.onclick=()=>{const x=S.items[it.id];if(x&&x.w>0)x.w--;S.answered--;mark(it.id,true);RUN.ok++;RUN.wrongs.pop();fb.className='fb ok';fb.querySelector('.fb-h').textContent='✓ Contado como correcto';b.remove();};
        fb.insertBefore(b,document.getElementById('nextbtn'));
      }
    };
  };
  draw();
}
function renderMatch(it,qb){
  const n=it.pairs.length,L=shuffle([...Array(n).keys()]),Rr=shuffle([...Array(n).keys()]);
  const done=new Set(),err=new Array(n).fill(false);let sel=null,errors=0;
  qb.innerHTML=`<div class="match"><div class="mcol">${L.map(i=>`<button class="mb ${it.lk?'k':''}" data-s="l" data-i="${i}">${it.pairs[i].l}</button>`).join('')}</div><div class="mcol">${Rr.map(i=>`<button class="mb" data-s="r" data-i="${i}">${it.pairs[i].r}</button>`).join('')}</div></div>`;
  const btn=(s,i)=>qb.querySelector(`[data-s="${s}"][data-i="${i}"]`);
  qb.querySelectorAll('.mb').forEach(b=>b.addEventListener('click',()=>{
    const s=b.dataset.s,i=+b.dataset.i;if(done.has(i)||RUN.locked)return;
    if(!sel||sel.s===s){if(sel)btn(sel.s,sel.i).classList.remove('sel');sel={s,i};b.classList.add('sel');return;}
    const other=btn(sel.s,sel.i);other.classList.remove('sel');
    if(sel.i===i){done.add(i);b.classList.add('done');other.classList.add('done');b.disabled=other.disabled=true;}
    else{errors++;const li=s==='l'?i:sel.i;err[li]=true;[b,other].forEach(x=>{x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),400);});}
    sel=null;
    if(done.size===n){RUN.locked=true;it.pairs.forEach((p,k)=>mark(p.id,!err[k]));
      it.explain=it.pairs.map(p=>`<span class="jp">${p.l}</span> — ${p.r}`).join('<br>');
      finish(errors===0,`${errors} ${errors===1?'error':'errores'}`,true);}
  }));
}
function renderDraw(it,qb){
  const k=it.k;
  qb.innerHTML=`<div class="drawinfo">音：${k.on.join('、')||'—'}　訓：${k.kun.join('、')||'—'}</div><div class="pad"><canvas id="cv" aria-label="Zona para dibujar"></canvas></div><div class="reveal" id="rv" hidden></div><div class="row" id="dr" style="margin-top:12px"><button class="btn ghost" id="clr">Borrar</button><button class="btn primary" id="show">Ver el kanji</button></div>`;
  const cv=qb.querySelector('#cv'),ctx=cv.getContext('2d');
  const fit=()=>{const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.scale(d,d);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=Math.max(6,r.width/34);ctx.strokeStyle=getComputedStyle(document.body).color;};
  fit();let drawing=false,last=null;
  const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  cv.addEventListener('pointerdown',e=>{drawing=true;last=pt(e);cv.setPointerCapture(e.pointerId);ctx.beginPath();ctx.arc(last[0],last[1],ctx.lineWidth/2,0,7);ctx.fillStyle=ctx.strokeStyle;ctx.fill();});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pt(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p;});
  const up=()=>{drawing=false;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  qb.querySelector('#clr').onclick=()=>{const r=cv.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);};
  qb.querySelector('#show').onclick=()=>{
    const rv=qb.querySelector('#rv');rv.hidden=false;rv.innerHTML=`<span class="bigk">${k.k}</span><span class="sub" style="margin:0">¿Lo has escrito bien?</span>`;
    qb.querySelector('#dr').innerHTML=`<button class="btn" id="no">✗ No</button><button class="btn primary" id="yes">✓ Sí</button>`;
    const fin=ok=>{if(RUN.locked)return;RUN.locked=true;qb.querySelectorAll('#dr button').forEach(b=>b.disabled=true);finish(ok,ok?'':'A repasarlo');};
    qb.querySelector('#yes').onclick=()=>fin(true);qb.querySelector('#no').onclick=()=>fin(false);
  };
}
function resultView(){
  const R=RUN,n=R.inf?R.done:R.items.length;
  if(!n){go('section',{sec:R.sec});return;}
  const pct=Math.round(R.ok/n*100);
  const word=pct>=90?'すばらしい！':pct>=70?'よくできました':pct>=50?'もう少し！':'がんばろう';
  const sum=w=>{const it=w.it;
    if(it.type==='match')return `<div class="wp">${it.tag}</div><div>${w.head}</div>`;
    const ans=it.type==='mc'?it.options[it.ans]:it.type==='input'?it.show:it.type==='order'?it.answerText:it.type==='draw'?`<span class="jk">${it.k.k}</span>`:'';
    return `<div class="wp">${it.prompt||esc(it.tag)}</div>${it.sub&&it.type!=='order'?`<div class="sub" style="margin:2px 0">${it.sub}</div>`:''}<div class="wa">→ ${ans}</div>`;};
  app.innerHTML=header(true,R.title)+`<main class="wrap">
    <div class="score"><div class="kk">${word}</div><b>${R.ok}/${n}</b><span>${pct}% de aciertos</span></div>
    ${R.wrongs.length?`<div class="lbl">Para repasar</div><div class="wlist">${R.wrongs.map(w=>`<div class="witem">${sum(w)}</div>`).join('')}</div>`:''}
    <div class="actions"><button class="btn primary" data-act="again">Otra ronda</button><button class="btn" data-act="tosec">Volver a ${SECTIONS[R.sec].t}</button><button class="btn ghost" data-act="home">Inicio</button></div>
  </main>`;
}

/* ================= EVENTOS ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-sec],[data-mode],[data-len],[data-kr],[data-gt],[data-gg],[data-go]');if(!t||t.disabled)return;
  if(t.dataset.sec){go('section',{sec:t.dataset.sec});return;}
  if(t.dataset.mode){startMode(VIEW.sec,t.dataset.mode);return;}
  if(t.dataset.len!==undefined){S.len=+t.dataset.len;save();render();return;}
  if(t.dataset.kr){const g=t.dataset.kr;if(g==='all')S.kg=[];else{const n=+g;S.kg=S.kg.includes(n)?S.kg.filter(x=>x!==n):S.kg.concat(n).sort((a,b)=>a-b);}save();render();return;}
  if(t.dataset.gt){const g=t.dataset.gt;if(g==='all')S.gt=[];else S.gt=S.gt.includes(g)?S.gt.filter(x=>x!==g):S.gt.concat(g);save();render();return;}
  if(t.dataset.gg!==undefined){const g=TGROUPS[+t.dataset.gg].s;const full=g.every(x=>S.gt.includes(x));S.gt=full?S.gt.filter(x=>!g.includes(x)):uniq(S.gt.concat(g));save();render();return;}
  if(t.dataset.go!==undefined){const gi=+t.dataset.go;const o=VIEW.open||[];VIEW.open=o.includes(gi)?o.filter(x=>x!==gi):o.concat(gi);render();return;}
  switch(t.dataset.act){
    case 'furi':S.furi=!S.furi;save();document.body.classList.toggle('nofuri',!S.furi);document.querySelectorAll('[data-act="furi"]').forEach(b=>{b.classList.toggle('on',S.furi);b.setAttribute('aria-pressed',S.furi);});break;
    case 'back':if(VIEW.name==='section')go('home');else if(VIEW.name==='result')go('section',{sec:RUN.sec});else go('home');break;
    case 'quit':if(RUN.inf)go('result');else go('section',{sec:RUN.sec});break;
    case 'next':next();break;
    case 'again':startMode(RUN.sec,RUN.mode);break;
    case 'tosec':go('section',{sec:RUN.sec});break;
    case 'home':go('home');break;
    case 'review':VIEW.sec='all';startMode('all','review');break;
  }
});
document.addEventListener('keydown',e=>{
  if(VIEW.name!=='quiz')return;
  const nb=document.getElementById('nextbtn');
  if(nb&&e.key==='Enter'&&document.activeElement!==nb){e.preventDefault();next();return;}
  if(!RUN.locked&&cur().type==='mc'&&/^[1-4]$/.test(e.key)){const b=document.querySelector(`.opt[data-i="${+e.key-1}"]`);if(b)b.click();}
});
render();
</script>
